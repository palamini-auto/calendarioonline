<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendario Officina</title>
    <style>
      :root {
        --cell-height: 55px;
        --cell-width: 30px;
        --w-col-1: 60px;
        --w-col-2: 60px;
        --w-col-3: 60px;
        --w-col-4: 20px;
        --blue-header: #c6dafc;
      }

      * { box-sizing: border-box; }

      body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background-color: #f1f3f4; overflow: hidden; }
      .main-container { display: block; overflow: auto; height: 100vh; width: 100vw; }

      table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: max-content; }

      th {
        position: sticky; top: 0; background: var(--blue-header); z-index: 40;
        border-bottom: 2px solid #ccc; border-right: 1px solid #ccc;
        height: 35px; font-weight: bold; font-size: 11px; text-align: center;
      }

      .sticky-left { position: sticky; z-index: 20; background: #fff; border-right: 1px solid #eee; border-bottom: 1px solid #eee; }
      th.sticky-left { z-index: 50; }

      .col-1 { width: var(--w-col-1); left: 0; }
      .col-2 { width: var(--w-col-2); left: var(--w-col-1); }
      .col-3 { width: var(--w-col-3); left: calc(var(--w-col-1) + var(--w-col-2)); }
      .col-4 { width: var(--w-col-4); left: calc(var(--w-col-1) + var(--w-col-2) + var(--w-col-3)); }

      .col-time { width: var(--cell-width); min-width: var(--cell-width); }

      .bordo-pausa      { border-right: 1px solid #000 !important; }
      .bordo-giorno-sup { border-top: 1px solid #000 !important; }
      .bordo-giorno-inf { border-bottom: 1px solid #000 !important; }

      td {
        height: var(--cell-height);
        border-right: 1px solid #eee;
        border-bottom: 1px solid #eee;
        padding: 0;
        background-color: white;
        cursor: cell;
        position: relative;
      }

      td.sticky-left:hover {
        background-color: #fff9c4 !important;
        outline: 2px solid #000;
        z-index: 30;
      }

      td:not(.sticky-left):hover { z-index: 10; }

      .hover-slot {
        position: absolute;
        top: 0; bottom: 0;
        width: var(--cell-width);
        background-color: #fff9c4 !important;
        outline: 2px solid #000;
        pointer-events: none;
        z-index: 5;
      }

      .testo-unito {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        justify-content: center;
        align-items: safe center;
        overflow: hidden;
        white-space: normal;
        word-break: break-word;
        font-weight: bold;
        font-size: 11px;
        line-height: 1.1;
        padding: 4px;
        text-align: center;
        pointer-events: none;
        z-index: 10;
      }

      .bg-att    { background-color: #f7b7b1 !important; color: #b71c1c; border: 1px solid #b71c1c !important; }
      .bg-m      { background-color: #adcaf9 !important; color: #0d47a1; border: 1px solid #0d47a1 !important; }
      .bg-pnm    { background-color: #fddb66 !important; color: #bf360c; border: 1px solid #bf360c !important; }
      .bg-sat    { background-color: #a8dab5 !important; color: #1b5e20; border: 1px solid #1b5e20 !important; }
      .bg-panda  { background-color: #ff9800 !important; color: white !important; }
      .bg-clio   { background-color: #9c27b0 !important; color: white !important; }
      .bg-generic{ background-color: #e8e8e8 !important; color: #333; border: 1px solid #000 !important; }

      .bg-mf-special {
        background-color: #adcaf9 !important;
        background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(13,71,161,0.2) 10px, rgba(13,71,161,0.2) 20px) !important;
        color: #0d47a1; border: 1px solid #0d47a1 !important;
      }
      .bg-mp-special {
        background-color: #f7b7b1 !important;
        background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(183,28,28,0.2) 10px, rgba(183,28,28,0.2) 20px) !important;
        color: #b71c1c; border: 1px solid #b71c1c !important;
      }
      .bg-pnm-special {
        background-color: #fddb66 !important;
        background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,152,0,0.4) 10px, rgba(255,152,0,0.4) 20px) !important;
        color: #bf360c; border: 1px solid #bf360c !important;
      }

      #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
      .modal-content { background: white; padding: 25px; border-radius: 8px; width: 450px; max-width: 95vw; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
      #modal-title { margin: 0; color: #1a73e8; font-size: 20px; font-weight: bold; border-bottom: 2px solid #f1f3f4; padding-bottom: 10px; }
      #input-lavoro { width: 100%; height: 120px; padding: 12px; font-size: 18px; text-transform: uppercase; border: 2px solid #1a73e8; border-radius: 4px; resize: none; font-family: inherit; font-weight: bold; }
      .modal-buttons { display: flex; gap: 10px; }
      .btn-save   { background: #1a73e8; color: white; border: none; padding: 15px; flex: 1; cursor: pointer; font-weight: bold; border-radius: 4px; }
      .btn-cancel { background: #eee; color: #333; border: none; padding: 15px; flex: 1; cursor: pointer; border-radius: 4px; }

      #loading-msg { padding: 20px; font-size: 14px; color: #555; }

      /* Sostitutive: cella divisa in segmenti (uno per persona) */
      .seg-wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; z-index: 10; }
      .seg {
        flex: 1 1 0; min-height: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding: 2px; overflow: hidden;
        text-align: center; font-weight: bold; font-size: 11px; line-height: 1.1;
        word-break: break-word; cursor: pointer;
      }
      .seg + .seg { border-top: 1px solid rgba(255,255,255,0.85); }
      .bg-panda .seg { background: #ff9800; }
      .bg-clio  .seg { background: #9c27b0; }
      .seg:hover { filter: brightness(1.2); outline: 2px solid #000; outline-offset: -2px; }
      .seg-ora { font-size: 9px; font-weight: normal; opacity: 0.9; margin-top: 1px; }

      #box-ora { display: none; font-size: 13px; color: #444; }
      #box-ora label { font-weight: bold; margin-right: 6px; }
      #select-ora { font-size: 15px; padding: 4px 6px; }
      #box-ora .hint { font-size: 11px; color: #777; margin-top: 6px; line-height: 1.3; }
    </style>
  </head>
  <body>

    <div class="main-container" id="tabella-container">
      <p id="loading-msg">⏳ Caricamento...</p>
    </div>

    <div id="modal-overlay">
      <div class="modal-content">
        <div id="modal-title">MODIFICA</div>
        <div id="modal-info-data" style="font-size:13px;color:#666;font-weight:bold;"></div>
        <textarea id="input-lavoro" placeholder=""></textarea>
        <div id="box-ora">
          <label for="select-ora">Dalle ore</label><select id="select-ora"></select>
          <div class="hint">Lascia l'ora com'è per modificare o cancellare questa assegnazione. Cambia l'ora per aggiungere una nuova persona da quell'ora in poi.</div>
        </div>
        <div class="modal-buttons">
          <button class="btn-cancel" onclick="chiudiModal()">ANNULLA</button>
          <button class="btn-save" id="btn-save-lavoro" onclick="salvaLavoro()">SALVA</button>
        </div>
      </div>
    </div>

    <script>
      // ============================================================
      // Backend: Cloudflare Pages Functions (stesso dominio, nessun URL da configurare)
      //   GET  /api/dati
      //   POST /api/scrivi
      // ============================================================
      const CACHE_KEY = "calendario_righe_v1";

      let datiModifica = {};
      let datiGlobale  = null;   // { mappa, date }
      let righeGlobali = [];     // ultime righe ricevute dal server
      let rigaMap      = {};     // "data|ora" -> numero di riga nel foglio
      let orariGlobal  = [];
      let salvataggiInCorso = 0;

      const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

      // ── Da righe compatte del server a struttura { mappa, date } ──
      function costruisciDati(righe) {
        const mappa = {};
        const date  = [];
        rigaMap = {};
        righe.forEach(r => {
          const [data, ora, A, M, S, P, C, riga] = r;
          if (!mappa[data]) { mappa[data] = {}; date.push(data); }
          mappa[data][ora] = { ANDREA: A, MATTEO: M, SARA: S, PANDA: P || "", CLIO: C || "" };
          rigaMap[data + "|" + ora] = riga;
        });
        return { mappa, date };
      }

      // ── Cache locale: mostra subito l'ultimo stato noto mentre arriva quello fresco ──
      function salvaCache() {
        try { localStorage.setItem(CACHE_KEY, JSON.stringify(righeGlobali)); } catch (e) {}
      }
      function leggiCache() {
        try {
          const raw = localStorage.getItem(CACHE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) { return null; }
      }

      // ── Render mantenendo la posizione di scroll ──
      function render(dati) {
        const cont = document.getElementById('tabella-container');
        const top = cont.scrollTop, left = cont.scrollLeft;
        costruisciTabella(dati);
        cont.scrollTop = top;
        cont.scrollLeft = left;
      }

      // ── Carica dati ──
      async function caricaDati(force) {
        // non sovrascrivere la schermata mentre c'è un salvataggio in corso
        if (salvataggiInCorso > 0 && !force) return;
        try {
          const r = await fetch("/api/dati", { cache: "no-store" });
          const j = await r.json();
          if (!r.ok || j.errore) throw new Error(j.errore || ("HTTP " + r.status));
          righeGlobali = j.righe;
          salvaCache();
          render(costruisciDati(righeGlobali));
        } catch (err) {
          if (!datiGlobale) {
            document.getElementById('tabella-container').innerHTML =
              `<p style="padding:20px;color:red;font-size:14px;">⚠️ ${esc(err.message)}</p>`;
          } else {
            console.error("Aggiornamento fallito:", err);
          }
        }
      }

      // ── Aggiorna una cella nei dati locali (mappa + righe in cache) ──
      function applicaLocale(data, ora, tecnico, v) {
        if (!datiGlobale.mappa[data]) datiGlobale.mappa[data] = {};
        if (!datiGlobale.mappa[data][ora]) datiGlobale.mappa[data][ora] = { ANDREA: "", MATTEO: "", SARA: "", PANDA: "", CLIO: "" };
        datiGlobale.mappa[data][ora][tecnico] = v;
        const idx = { ANDREA: 2, MATTEO: 3, SARA: 4, PANDA: 5, CLIO: 6 }[tecnico];
        const rr = righeGlobali.find(x => x[0] === data && x[1] === ora);
        if (rr && idx !== undefined) rr[idx] = v;
      }

      // ── Salvataggio: aggiorna subito lo schermo, scrive in background ──
      async function salvaLavoro() {
        const v = document.getElementById('input-lavoro').value.trim().toUpperCase();
        const { data, tecnico } = datiModifica;
        let ore;

        if (datiModifica.veicolo) {
          // Sostitutive: se l'ora è quella di partenza del segmento → modifica/cancella TUTTE
          // le righe di quel segmento che hanno quel valore; se l'ora è diversa → nuova
          // assegnazione a partire da quell'ora.
          const sel = document.getElementById('select-ora').value;
          const seg = datiModifica.segmento;
          if (seg && sel === seg.inizio) {
            ore = seg.ore.slice();
          } else {
            if (!v) { chiudiModal(); return; }
            ore = [sel];
          }
        } else {
          ore = [datiModifica.ora];
        }

        // aggiornamento locale immediato
        ore.forEach(o => applicaLocale(data, o, tecnico, v));
        chiudiModal();
        render(datiGlobale);

        const celle = ore.map(o => ({ ora: o, riga: rigaMap[data + "|" + o] || 0 }));

        salvataggiInCorso++;
        let errore = null;
        try {
          const r = await fetch("/api/scrivi", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ data, tecnico, valore: v, celle })
          });
          const j = await r.json();
          if (!r.ok || !j.success) throw new Error(j.errore || ("HTTP " + r.status));
          salvaCache();
        } catch (err) {
          errore = err;
        } finally {
          salvataggiInCorso--;
        }

        if (errore) {
          alert("Errore salvataggio: " + errore.message);
          caricaDati(true); // riallinea con il foglio
        }
      }

      // ── Costruzione tabella ──
      function costruisciTabella(dati) {
        datiGlobale = dati;
        const nomi = ["ANDREA", "MATTEO", "SARA"];

        const orari = [];
        for (let h = 8; h <= 12; h++) {
          for (let m = 0; m < 60; m += 10) {
            orari.push(`${h < 10 ? '0' + h : h}:${m == 0 ? '00' : m}`);
            if (h == 12 && m == 0) break;
          }
        }
        orari.push("13:50");
        for (let h = 14; h <= 18; h++) {
          for (let m = 0; m < 60; m += 10) {
            orari.push(`${h < 10 ? '0' + h : h}:${m == 0 ? '00' : m}`);
            if (h == 18 && m == 30) break;
          }
        }
        orariGlobal = orari;

        let html = "<table><thead><tr>";
        html += "<th class='sticky-left col-1'>DATA</th>";
        html += "<th class='sticky-left col-2'>CLIO SCURA</th>";
        html += "<th class='sticky-left col-3'>CLIO BIANCA</th>";
        html += "<th class='sticky-left col-4'>TEC</th>";
        orari.forEach(ora => {
          html += `<th class='col-time ${ora === "12:00" ? "bordo-pausa" : ""}'>${ora}</th>`;
        });
        html += "</tr></thead><tbody>";

        dati.date.forEach(data => {
          const segPanda = segmentiVeicolo(dati, data, "PANDA");
          const segClio  = segmentiVeicolo(dati, data, "CLIO");
          const dEsc = esc(data);

          nomi.forEach((nome, index) => {
            let visualNome   = nome === "ANDREA" ? "A" : nome === "MATTEO" ? "M" : "S";
            let rigaBordoCls = nome === "ANDREA" ? "bordo-giorno-sup" : nome === "SARA" ? "bordo-giorno-inf" : "";

            html += "<tr>";

            if (index === 0) {
              html += `<td rowspan="3" class='sticky-left col-1 bordo-giorno-sup bordo-giorno-inf'><div class="testo-unito">${dEsc}</div></td>`;
              html += cellaVeicolo(dEsc, "PANDA", segPanda, "col-2", "bg-panda");
              html += cellaVeicolo(dEsc, "CLIO", segClio, "col-3", "bg-clio");
            }

            html += `<td class='sticky-left col-4 ${rigaBordoCls}'><div class="testo-unito" style="color:#555">${visualNome}</div></td>`;

            let skip = 0;
            orari.forEach(ora => {
              if (skip > 0) { skip--; return; }

              let valRaw   = (dati.mappa[data]?.[ora]?.[nome] || "").trim();
              let isPausa  = (ora === "12:00");
              let classiTd = `${rigaBordoCls} ${isPausa ? "bordo-pausa" : ""}`;

              if (valRaw && valRaw !== "/" && valRaw !== ".") {
                let n    = contaDurata(dati, data, nome, ora, orari);
                let tVal = valRaw.toUpperCase().trim();
                let cls  = "";

                if      (tVal.startsWith("MF"))                   cls = "bg-mf-special";
                else if (tVal.startsWith("MP"))                   cls = "bg-mp-special";
                else if (tVal === "PNM 1H" || tVal === "PNM 3H") cls = "bg-pnm-special";
                else if (tVal.startsWith("ATT"))                  cls = "bg-att";
                else if (tVal.startsWith("PNM"))                  cls = "bg-pnm";
                else if (tVal.startsWith("SAT"))                  cls = "bg-sat";
                else if (tVal.startsWith("M"))                    cls = "bg-m";
                else                                              cls = "bg-generic";

                html += `<td colspan="${n}" class="${cls} ${classiTd}" onclick="clickCella(event,'${dEsc}','${ora}','${nome}')"><div class="testo-unito">${esc(valRaw)}</div></td>`;
                skip = n - 1;
              } else {
                html += `<td class="${classiTd}" onclick="clickCella(event,'${dEsc}','${ora}','${nome}')"></td>`;
              }
            });
            html += "</tr>";
          });
        });

        document.getElementById('tabella-container').innerHTML = html + "</tbody></table>";
      }

      // ── Click su cella (rileva lo slot preciso dentro un colspan) ──
      function clickCella(event, d, o_start, t) {
        let rect     = event.currentTarget.getBoundingClientRect();
        let clientX  = event.clientX || (event.touches && event.touches[0].clientX);
        let x        = clientX - rect.left;
        let idx      = orariGlobal.indexOf(o_start);
        let currentX = 0;
        let clickedOra = o_start;
        for (let i = idx; i < orariGlobal.length; i++) {
          let w = 30;
          if (x < currentX + w) { clickedOra = orariGlobal[i]; break; }
          currentX += w;
        }
        let actualVal = (datiGlobale.mappa[d]?.[clickedOra]?.[t] || "").trim();
        apriModal(d, clickedOra, t, actualVal);
      }

      // ── Sostitutive (PANDA / CLIO) ──
      // Il valore vale finché non compare un valore diverso: ogni cambio di valore
      // durante la giornata è un "segmento" (es. PIPPO 8:00–9:00, FRANCO 9:00–fine).
      // Celle vuote, "/" e "." non spezzano il segmento.
      function segmentiVeicolo(dati, data, veicolo) {
        const giorno = dati.mappa[data] || {};
        const segs = [];
        for (const ora of Object.keys(giorno)) {           // ordine del foglio
          let v = (giorno[ora]?.[veicolo] || "").trim();
          if (!v || v === "/" || v === ".") continue;
          const last = segs[segs.length - 1];
          if (last && last.valore === v) { last.ore.push(ora); continue; }
          segs.push({ valore: v, inizio: ora, ore: [ora] });  // ore = righe che portano questo valore
        }
        segs.forEach((s, i) => { s.fine = i < segs.length - 1 ? segs[i + 1].inizio : null; });
        return segs;
      }

      function cellaVeicolo(dEsc, veicolo, segs, colCls, bgCls) {
        const base = `rowspan="3" class="sticky-left ${colCls} bordo-giorno-sup bordo-giorno-inf`;
        if (!segs.length) {
          return `<td ${base}" onclick="apriModalVeicolo('${dEsc}','${veicolo}',-1)"></td>`;
        }
        const fmt = o => o.replace(/^0/, "");
        const multi = segs.length > 1;
        let inner = "";
        segs.forEach((s, i) => {
          const orario = multi ? `<span class="seg-ora">${fmt(s.inizio)}–${s.fine ? fmt(s.fine) : "fine"}</span>` : "";
          inner += `<div class="seg" onclick="apriModalVeicolo('${dEsc}','${veicolo}',${i})"><span class="seg-nome">${esc(s.valore)}</span>${orario}</div>`;
        });
        return `<td ${base} ${bgCls}"><div class="seg-wrap">${inner}</div></td>`;
      }

      function apriModalVeicolo(d, t, idx) {
        const seg = idx >= 0 ? segmentiVeicolo(datiGlobale, d, t)[idx] : null;
        apriModal(d, seg ? seg.inizio : "08:00", t, seg ? seg.valore : "", seg);
      }

      // ── Modal ──
      function apriModal(d, o, t, v, seg) {
        const isV = (t === "PANDA" || t === "CLIO");
        datiModifica = { data: d, ora: o, tecnico: t, veicolo: isV, segmento: seg || null };
        document.getElementById('modal-title').innerText     = isV ? t + " (sostitutiva)" : t + " - Ore " + o;
        document.getElementById('modal-info-data').innerText = "Data: " + d;

        const box = document.getElementById('box-ora');
        box.style.display = isV ? 'block' : 'none';
        if (isV) {
          const sel = document.getElementById('select-ora');
          sel.innerHTML = orariGlobal.map(x => `<option value="${x}">${x}</option>`).join("");
          sel.value = o;
        }

        const input = document.getElementById('input-lavoro');
        input.value = v;
        document.getElementById('modal-overlay').style.display = 'flex';
        setTimeout(() => {
          input.focus();
          const len = input.value.length;
          input.setSelectionRange(len, len);
        }, 100);
      }

      function chiudiModal() {
        document.getElementById('modal-overlay').style.display = 'none';
      }

      // ── Conta durata (colspan) ──
      function contaDurata(dati, data, nome, oraInizio, lista) {
        let c = 0; let ok = false;
        for (let o of lista) {
          if (o === oraInizio) ok = true;
          if (ok) {
            let v = (dati.mappa[data]?.[o]?.[nome] || "").trim();
            if (o === oraInizio || v === "/") {
              c++;
              if (o === "12:00") break;
            } else break;
          }
        }
        return c;
      }

      // ── Hover slot giallo ──
      const hoverBox = document.createElement('div');
      hoverBox.className = 'hover-slot';

      document.addEventListener('mousemove', function(e) {
        const td = e.target.closest('td');
        if (!td || td.classList.contains('sticky-left')) {
          if (hoverBox.parentNode) hoverBox.parentNode.removeChild(hoverBox);
          return;
        }
        const rect      = td.getBoundingClientRect();
        const x         = e.clientX - rect.left;
        const colspan   = parseInt(td.getAttribute('colspan') || 1);
        const slotWidth = rect.width / colspan;
        let slotIndex   = Math.floor(x / slotWidth);
        if (slotIndex >= colspan) slotIndex = colspan - 1;
        if (slotIndex < 0)        slotIndex = 0;
        if (hoverBox.parentNode !== td) td.appendChild(hoverBox);
        hoverBox.style.width = slotWidth + 'px';
        hoverBox.style.left  = (slotIndex * slotWidth) + 'px';
      });

      document.addEventListener('mouseleave', function() {
        if (hoverBox.parentNode) hoverBox.parentNode.removeChild(hoverBox);
      });

      // ── Auto-refresh: ogni 15 min, solo se la pagina è visibile ──
      const REFRESH_MS = 15 * 60 * 1000;
      let _refreshTimer  = null;
      let _lastRefresh   = 0;

      const _caricaESegna = () => { _lastRefresh = Date.now(); caricaDati(); };

      function avviaRefreshDa(ms) {
        if (_refreshTimer) clearTimeout(_refreshTimer);
        _refreshTimer = setTimeout(() => {
          _caricaESegna();
          avviaRefreshDa(REFRESH_MS);
        }, ms);
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          clearTimeout(_refreshTimer);
          _refreshTimer = null;
        } else {
          const passati = Date.now() - _lastRefresh;
          if (passati >= REFRESH_MS) {
            _caricaESegna();
            avviaRefreshDa(REFRESH_MS);
          } else {
            avviaRefreshDa(REFRESH_MS - passati);
          }
        }
      });

      // ── Avvio: mostra subito la cache locale (se c'è), poi aggiorna dal foglio ──
      (function avvio() {
        const cached = leggiCache();
        if (cached && cached.length) {
          righeGlobali = cached;
          render(costruisciDati(righeGlobali));
        }
        _caricaESegna();
        avviaRefreshDa(REFRESH_MS);
      })();
    </script>
  </body>
</html>
